# GPT-2 (124M) on WikiText-2 with Federated DiLoCo & DARL
# Fast testing configuration for multi-site LLM training across Snellius & LUMI

model: gpt2
dataset-name: wikitext
dataset-config: wikitext-2-raw-v1
seq-len: 1024
batch-size: 4

dtype: bf16
attn-implementation: sdpa

# --- DiLoCo Inner Loop ---
diloco-inner-steps: 50
lr: 3e-4
weight-decay: 0.01
gradient-accumulation-steps: 1

# --- Outer Aggregation ---
diloco-outer-optimizer: sgd
diloco-outer-lr: 1.0
diloco-outer-momentum: 0.0

save-every: 5
log-every: 10
seed: 42

# --- DARL Token Dataset Leasing ---
darl-num-samples: 2335
darl-block-size: 100
