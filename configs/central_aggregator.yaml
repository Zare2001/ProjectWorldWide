# Central Node / Aggregator Configuration for Multi-Site DiLoCo Training with FedMom
#
# Runs on the Central Ubuntu Cloud VM (145.38.206.143).
# Configured to use explicit open Security Group ports:
#   - DARL HTTP port: 29510
#   - Flower gRPC port: 29511

darl-port: 29510
flower-port: 29511

# FedMom / FedAvg Strategy Parameters
# For ResNet with BatchNorm, outer momentum must be 0.0 (FedAvg) to keep outer weights
# inside the convex hull and preserve BatchNorm statistics (see configs/cifar10_resnet18_diloco.yaml).
server-learning-rate: 1.0
server-momentum: 0.0
num-rounds: 50
min-clients: 2
round-timeout: 300.0

# Dataset Leasing Settings (DARL)
num-samples: 115156
block-size: 100
darl-state-dir: "./runs/darl"
