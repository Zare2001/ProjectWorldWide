# Qwen3 0.6B on C4, DARL-leased, cross-site DiLoCo 1k-step run via Flower + FedMom.
#
# The short-run pair of configs/titan/qwen3_0.6b_c4_diloco.toml -- 1,000 steps, 10 outer
# rounds at darl.inner_steps = 100 -- for validating a full central-plus-two-sites setup
# inside one queue slot. See that file for why each setting is what it is.
#
# Its baseline is configs/titan/qwen3_0.6b_c4_central_1k.toml, which is this file with
# flower.enable = false. Read that header before reading a chart with both runs on it:
# equal steps is not equal tokens.

[job]
dump_folder = "./outputs/qwen3-0.6b-c4-diloco-1k"
description = "Qwen3 0.6B C4 cross-site DiLoCo 1k-step run (DARL + Flower/FedMom)"
custom_config_module = "pww.titan.config"

[experimental]
custom_import = "pww.titan"

[model]
name = "pww_qwen3"
flavor = "0.6B"
hf_assets_path = "./data/tokenizers/tokenizer-128k"

[metrics]
log_freq = 10

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 100
decay_ratio = 0.1
decay_type = "cosine"
min_lr_factor = 0.1

[training]
dtype = "bfloat16"
local_batch_size = 8
seq_len = 2048
steps = 1000
max_norm = 1.0
dataset = "pww_tokens"
dataset_path = "./data/c4-oellm128k-2048"

[parallelism]
data_parallel_shard_degree = -1
tensor_parallel_degree = 1

[activation_checkpoint]
mode = "selective"

[checkpoint]
enable = true
interval = 100
last_save_model_only = false
keep_latest_k = 2

[comm]
train_timeout_seconds = 1800

[validation]
enable = true
# The bundled fixture overlaps the C4 training files; run_train.sh upgrades this to the
# real held-out split (c4_local) when $PWW_DATA_DIR/c4-validation is staged. See the 20k
# config for the full note.
dataset = "c4_test"
dataset_path = "./third_party/torchtitan/tests/assets/c4_test"
freq = 100
steps = 20

[fault_tolerance]
enable = false

[darl]
url = ""
site = ""
inner_steps = 100
block_size = 1024
blocks_per_phase = 0
epochs = 1
space_seed = 42

[flower]
enable = true
server_address = ""
transport = "inline"
wire_dtype = "bfloat16"
