# Qwen3 1.7B, single site, DARL-leased. A scaling test for the *compute* half.
#
# What this config is for: proving that FSDP2, activation checkpointing and the DARL
# dataloader carry a model this size on one facility, and measuring tokens/s/GPU
# there. That is the part this repo's own code has to get right, and it is orthogonal
# to the outer step, so flower.enable stays false.
#
# If you do turn the federation on here, it must be with transport = "blob". The
# flavor called "1.7B" is 1,947,329,536 parameters once the embedding and output
# projection are sized to the 128k tokenizer's padded 131328-row vocabulary -- 3.6 GiB
# in float16, against a gRPC message cap of 2 GiB exactly (2**31-1). That cap is a
# protocol limit; no flower.max_message_length setting moves it, and the inline
# transport exchanges a full parameter set per round. The client checks this at startup
# and refuses with the arithmetic rather than failing mid-round on a truncated message.
#
# Out-of-band transport removes the ceiling entirely -- see configs/titan/
# qwen3_8b_c4_diloco.toml for a config that uses it, and FEDERATION_GUIDE.md for the
# measured table of which flavors fit which transport.
#
#   scripts/titan/run_train.sh --config configs/titan/qwen3_1.7b_scaling.toml
#
# Larger flavors (4B, 8B, 14B, 32B) exist in torchtitan's table and this config
# reaches them by changing model.flavor plus, past 4B or so,
# parallelism.tensor_parallel_degree. Streaming keeps the merge cost flat as they
# grow: 14B and 32B have the same largest tensor, so the same peak memory.

[job]
dump_folder = "./outputs/qwen3-1.7b-scaling"
description = "Qwen3 1.7B single-site scaling test (DARL, no cross-site outer step)"
custom_config_module = "pww.titan.config"

[experimental]
custom_import = "pww.titan"

[model]
name = "pww_qwen3"
flavor = "1.7B"
hf_assets_path = "./data/tokenizers/tokenizer-128k"

[metrics]
log_freq = 10

[optimizer]
name = "AdamW"
# Lower than 0.6B's 3e-4, as capacity goes up.
lr = 1.5e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 500
decay_ratio = 0.1
decay_type = "cosine"
min_lr_factor = 0.1

[training]
dtype = "bfloat16"
# Halved against 0.6B to hold activation memory roughly constant as the model
# grows. Expect to tune this per facility -- an MI250x GCD has 64 GB against an
# H100's 80.
local_batch_size = 4
seq_len = 2048
steps = 50000
max_norm = 1.0
dataset = "pww_tokens"
dataset_path = "./data/c4-oellm128k-2048"

[parallelism]
data_parallel_shard_degree = -1
# Still 1: 1.7B shards fine under pure FSDP2. Tensor parallelism starts paying for
# its extra collectives somewhere around 4B-8B, and only within a node.
tensor_parallel_degree = 1

[activation_checkpoint]
mode = "selective"

[checkpoint]
enable = true
# Saved after every outer aggregation round (H=100). DARL commits are triggered
# immediately on every round alongside checkpoint creation.
interval = 100
last_save_model_only = false
keep_latest_k = 2

[comm]
train_timeout_seconds = 300

[validation]
enable = true
dataset = "c4_test"
dataset_path = "./third_party/torchtitan/tests/assets/c4_test"
freq = 1000
steps = 20

[fault_tolerance]
enable = false

[darl]
url = ""
site = ""
inner_steps = 100
block_size = 1024
blocks_per_phase = 0
epochs = 1
space_seed = 42

[flower]
# See the header: this config exists to measure the compute half on one site.
enable = false
# "blob", not "inline", even though flower.enable is false -- so that turning the
# federation on here works rather than tripping the 2 GiB gRPC cap on the first round.
# 1.95B parameters is 3.6 GiB in float16. Must match the central node's --transport,
# which for blob also brings up the blob store on 29512.
transport = "blob"
