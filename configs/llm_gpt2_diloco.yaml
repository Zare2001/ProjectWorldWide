# GPT-2 (124M) on WikiText-103 (100M tokens, 1,000 blocks) with Federated DiLoCo & DARL
# Single-pass 1-epoch LLM pre-training across Snellius & LUMI

model: gpt2
dataset-name: wikitext
dataset-config: wikitext-103-raw-v1
seq-len: 1024
batch-size: 4

dtype: bf16
attn-implementation: sdpa

# --- DiLoCo Inner Loop ---
diloco-inner-steps: 50
lr: 3e-4
weight-decay: 0.01
gradient-accumulation-steps: 1

# --- Outer Aggregation ---
diloco-outer-optimizer: sgd
diloco-outer-lr: 1.0
diloco-outer-momentum: 0.0

save-every: 1
log-every: 10
seed: 42

# --- DARL Token Dataset Leasing ---
darl-num-samples: 115156
darl-block-size: 100
