# Qwen3 0.6B on C4, DARL-leased, single-node 1k-step central baseline.
#
# The short-run pair of configs/titan/qwen3_0.6b_c4_central.toml: 1,000 steps instead of
# 20,000 and a 100-step warmup instead of 200, for shaking out a full central-plus-two-
# sites setup inside one queue slot. Identical to
# configs/titan/qwen3_0.6b_c4_diloco_1k.toml except for flower.enable.
#
# 1,000 steps at darl.inner_steps = 100 is 10 outer rounds, so the aggregator's
# num-rounds only has to be >= 10; configs/central_aggregator_titan.yaml's 200 is a
# harmless upper bound.
#
# Step-matched, not token-matched -- the same caveat as the 20k config, and the same fix.
# Per optimiser step this baseline trains local_batch_size x seq_len x ranks tokens
# (65,536 on 4 H100s, 131,072 on 8 GCDs) against the two-site federation's 196,608. Plot
# on `train/cum_tokens`, WandB's default x-axis here, and use PWW_GRAD_ACCUM=3 on
# Snellius for the compute-matched run. Full arithmetic in the 20k config's header.

[job]
dump_folder = "./outputs/qwen3-0.6b-c4-central-1k"
description = "Qwen3 0.6B C4 central 1k-step comparison run (DARL-leased, single-node)"
custom_config_module = "pww.titan.config"

[experimental]
custom_import = "pww.titan"

[model]
name = "pww_qwen3"
flavor = "0.6B"
hf_assets_path = "./data/tokenizers/tokenizer-128k"

[metrics]
log_freq = 10

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-8

[lr_scheduler]
warmup_steps = 100
decay_ratio = 0.1
decay_type = "cosine"
min_lr_factor = 0.1

[training]
dtype = "bfloat16"
local_batch_size = 8
seq_len = 2048
steps = 1000
max_norm = 1.0
dataset = "pww_tokens"
dataset_path = "./data/c4-oellm128k-2048"

[parallelism]
data_parallel_shard_degree = -1
tensor_parallel_degree = 1

[activation_checkpoint]
mode = "selective"

[checkpoint]
enable = true
interval = 100
last_save_model_only = false
keep_latest_k = 2

[comm]
train_timeout_seconds = 1800

[validation]
enable = true
# The bundled fixture overlaps the C4 training files; run_train.sh upgrades this to the
# real held-out split (c4_local) when $PWW_DATA_DIR/c4-validation is staged. See the 20k
# config for the full note.
dataset = "c4_test"
dataset_path = "./third_party/torchtitan/tests/assets/c4_test"
freq = 100
steps = 20

[fault_tolerance]
enable = false

[darl]
url = ""
site = ""
inner_steps = 100
block_size = 1024
blocks_per_phase = 0
epochs = 1
space_seed = 42

[flower]
enable = false
server_address = ""
transport = "inline"
wire_dtype = "bfloat16"
