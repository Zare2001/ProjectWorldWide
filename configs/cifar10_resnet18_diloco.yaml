# ResNet-18 on CIFAR-10 with DiLoCo. Site-independent: k is expressed in
# replicas, not ranks, so the same file works on LUMI's 8 GCDs and Snellius's
# 4 GPUs -- only how many ranks land inside each replica changes.
#
#   sbatch scripts/lumi/job_cifar_diloco.sh
#   sbatch scripts/snellius/job_cifar_diloco.sh
#
# Anything on the command line still wins over what is set here.

model: resnet18

# Per rank. Note that under DiLoCo the LR is scaled to the *replica* batch, not
# the world batch, because a step only synchronises inside one replica.
batch-size: 128
num-workers: 6

epochs: 30
lr: 0.1
momentum: 0.9
weight-decay: 0.0005
warmup-epochs: 2

# InnerOpt. The paper uses AdamW, which is right for transformers; SGD+Nesterov
# is what actually works for ResNet/CIFAR, so keep it here and switch to adamw
# for the LLM phase.
inner-optimizer: sgd

parallel: ddp
dtype: fp32

# --- DiLoCo ---------------------------------------------------------------
# k=2: two replicas. Must divide the rank count -- 8 GCDs on LUMI allow
# 1,2,4,8; 4 GPUs on Snellius allow 1,2,4.
diloco-replicas: 2

# H. The paper uses several hundred, but a CIFAR-10 epoch at this batch size is
# only ~390/k steps, so H=100 already means roughly one exchange per epoch per
# replica. Larger H here mostly measures how far replicas can drift before
# averaging stops helping -- watch the "agreement" number in metrics.jsonl:
# near 1.0 means the replicas still agree, near 1/sqrt(k) means averaging is
# cancelling most of their progress and H is too large.
#
# Count the steps when picking H: DistributedSampler shards over the *world*, not
# per replica, so steps per epoch is 50000/(ranks * batch-size) regardless of k.
# On 8 GCDs at batch 128 that is 48, so 30 epochs is 1440 inner steps and H=100
# gives T=14 outer steps. Measured here: 92.17% at H=100 against 92.41% at H=25,
# so the 4x extra communication buys 0.24 points -- keep H=100.
diloco-inner-steps: 100

# OuterOpt. NOT the paper's Nesterov, deliberately -- measured on this model,
# 8 GCDs, 30 epochs, against 93.35% for plain DDP:
#
#   sgd 1.0/0.0 (this)      H=100 -> 92.17%      H=25 -> 92.41%
#   nesterov 0.7/0.9        H=100 -> 85.70%      H=25 -> 90.04%
#
# Nesterov's outer step overshoots past every replica's weights, landing theta
# outside their convex hull, where the averaged BatchNorm running statistics no
# longer apply. FedAvg's mean_i theta_i stays inside it. The paper's models use
# LayerNorm and have no running statistics to invalidate, which is why their
# default is fine there and not here -- revisit it for the LLM phase. The full
# write-up is in the README.
diloco-outer-optimizer: sgd
diloco-outer-lr: 1.0
diloco-outer-momentum: 0.0

save-every: 10
log-every: 50
seed: 42
